<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - MusicFlow</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-primary);
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
        }
        .login-logo {
            font-size: 3rem;
            margin-bottom: 30px;
        }
        .login-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 40px;
        }
        .social-login {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: transparent;
            color: var(--text-primary);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .social-btn:hover {
            background: var(--bg-elevated);
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 30px 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 1rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--text-primary);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 30px;
            color: var(--bg-primary);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: var(--transition);
        }
        .login-btn:hover {
            transform: scale(1.02);
            background: var(--accent-hover);
        }
        .login-footer {
            margin-top: 30px;
            color: var(--text-secondary);
        }
        .login-footer a {
            color: var(--text-primary);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">🎵</div>
        <h1 class="login-title">登录 MusicFlow</h1>

        <div class="social-login">
            <button class="social-btn">📱 使用手机号登录</button>
            <button class="social-btn">💬 使用微信登录</button>
            <button class="social-btn">🍎 使用 Apple 登录</button>
        </div>

        <div class="divider">或</div>

        <form class="login-form">
            <div class="form-group">
                <label>邮箱或用户名</label>
                <input type="text" placeholder="邮箱或用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" placeholder="密码">
            </div>
            <button type="submit" class="login-btn">登录</button>
        </form>

        <p class="login-footer">
            还没有账户？<a href="register.html">免费注册</a>
        </p>
    </div>

    <script src="../js/main.js"></script>
</body>
</html>
