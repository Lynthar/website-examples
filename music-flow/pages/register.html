<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - MusicFlow</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-primary);
        }
        .register-container {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            text-align: center;
        }
        .register-logo {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .register-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .register-subtitle {
            color: var(--text-secondary);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 1rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--text-primary);
        }
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            text-align: left;
            margin: 20px 0;
        }
        .checkbox-group input {
            margin-top: 4px;
        }
        .checkbox-group span {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .checkbox-group a {
            color: var(--accent);
        }
        .register-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 30px;
            color: var(--bg-primary);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .register-btn:hover {
            transform: scale(1.02);
            background: var(--accent-hover);
        }
        .register-footer {
            margin-top: 30px;
            color: var(--text-secondary);
        }
        .register-footer a {
            color: var(--text-primary);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-logo">🎵</div>
        <h1 class="register-title">免费注册 MusicFlow</h1>
        <p class="register-subtitle">开启你的音乐之旅</p>

        <form class="register-form">
            <div class="form-group">
                <label>邮箱地址</label>
                <input type="email" placeholder="输入你的邮箱">
            </div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" placeholder="创建一个用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" placeholder="创建密码 (至少8个字符)">
            </div>
            <div class="form-group">
                <label>出生日期</label>
                <input type="date">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms">
                <span>
                    我已阅读并同意 <a href="privacy.html">隐私政策</a> 和 <a href="#">服务条款</a>
                </span>
            </div>

            <button type="submit" class="register-btn">注册</button>
        </form>

        <p class="register-footer">
            已有账户？<a href="login.html">立即登录</a>
        </p>
    </div>

    <script src="../js/main.js"></script>
</body>
</html>
