<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏库 - GameZone</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .library-page { padding-top: 90px; min-height: 100vh; }
        .library-header { padding: 40px 0; border-bottom: 1px solid var(--dark-300); }
        .library-stats { display: flex; gap: 40px; margin-top: 20px; }
        .stat-box { text-align: center; }
        .stat-box .number { font-size: 2rem; font-weight: 700; color: var(--primary-light); }
        .stat-box .label { color: var(--gray); font-size: 0.9rem; }
        .library-content { display: flex; gap: 30px; padding: 30px 0; }
        .library-sidebar { width: 250px; flex-shrink: 0; }
        .sidebar-section { margin-bottom: 30px; }
        .sidebar-section h3 { font-size: 0.85rem; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: var(--light); text-decoration: none; border-radius: 8px; transition: all 0.3s; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active { background: var(--dark-300); color: var(--primary-light); }
        .library-main { flex: 1; }
        .games-list { display: flex; flex-direction: column; gap: 12px; }
        .game-row { display: flex; align-items: center; gap: 20px; background: var(--dark-200); padding: 16px; border-radius: 12px; cursor: pointer; transition: all 0.3s; }
        .game-row:hover { background: var(--dark-300); transform: translateX(5px); }
        .game-row .cover { width: 120px; height: 45px; border-radius: 6px; flex-shrink: 0; }
        .game-row .info { flex: 1; }
        .game-row .info h4 { font-size: 1rem; margin-bottom: 4px; }
        .game-row .info span { font-size: 0.85rem; color: var(--gray); }
        .game-row .actions { display: flex; gap: 10px; }
        .game-row .play-btn { padding: 10px 24px; background: var(--gradient-primary); border: none; border-radius: 6px; color: white; font-weight: 600; cursor: pointer; }
        .empty-state { text-align: center; padding: 80px 20px; color: var(--gray); }
        .empty-state .icon { font-size: 4rem; margin-bottom: 20px; opacity: 0.5; }
    </style>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="nav-left">
                <a href="../index.html" class="logo">
                    <span class="logo-icon">🎮</span>
                    <span class="logo-text">GameZone</span>
                </a>
                <ul class="nav-menu">
                    <li><a href="../index.html">商店</a></li>
                    <li><a href="library.html" class="active">游戏库</a></li>
                    <li><a href="community.html">社区</a></li>
                </ul>
            </div>
            <div class="nav-right">
                <a href="login.html" class="user-btn">登录</a>
            </div>
        </nav>
    </header>

    <main class="library-page">
        <div class="container">
            <div class="library-header">
                <h1 style="font-family: 'Rajdhani', sans-serif; font-size: 2rem;">我的游戏库</h1>
                <div class="library-stats">
                    <div class="stat-box">
                        <div class="number">12</div>
                        <div class="label">已拥有游戏</div>
                    </div>
                    <div class="stat-box">
                        <div class="number">256</div>
                        <div class="label">游戏时长(小时)</div>
                    </div>
                    <div class="stat-box">
                        <div class="number">45</div>
                        <div class="label">成就解锁</div>
                    </div>
                </div>
            </div>

            <div class="library-content">
                <aside class="library-sidebar">
                    <div class="sidebar-section">
                        <h3>筛选</h3>
                        <ul class="sidebar-menu">
                            <li><a href="#" class="active">📚 全部游戏</a></li>
                            <li><a href="#">⏰ 最近游玩</a></li>
                            <li><a href="#">⭐ 收藏夹</a></li>
                            <li><a href="#">📥 已安装</a></li>
                        </ul>
                    </div>
                    <div class="sidebar-section">
                        <h3>分类</h3>
                        <ul class="sidebar-menu">
                            <li><a href="#">⚔️ 动作游戏</a></li>
                            <li><a href="#">🧙 角色扮演</a></li>
                            <li><a href="#">🎯 射击游戏</a></li>
                            <li><a href="#">🧩 益智游戏</a></li>
                        </ul>
                    </div>
                </aside>

                <div class="library-main">
                    <div class="games-list">
                        <div class="game-row">
                            <div class="cover" style="background: linear-gradient(45deg, #667eea, #764ba2);"></div>
                            <div class="info">
                                <h4>艾尔登法环</h4>
                                <span>游玩时间: 86小时 · 上次游玩: 2天前</span>
                            </div>
                            <div class="actions">
                                <button class="play-btn">开始游戏</button>
                            </div>
                        </div>
                        <div class="game-row">
                            <div class="cover" style="background: linear-gradient(45deg, #1a1a2e, #16213e);"></div>
                            <div class="info">
                                <h4>博德之门3</h4>
                                <span>游玩时间: 124小时 · 上次游玩: 1周前</span>
                            </div>
                            <div class="actions">
                                <button class="play-btn">开始游戏</button>
                            </div>
                        </div>
                        <div class="game-row">
                            <div class="cover" style="background: linear-gradient(45deg, #11998e, #38ef7d);"></div>
                            <div class="info">
                                <h4>荒野大镖客2</h4>
                                <span>游玩时间: 46小时 · 上次游玩: 1个月前</span>
                            </div>
                            <div class="actions">
                                <button class="play-btn">开始游戏</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/main.js"></script>
</body>
</html>
