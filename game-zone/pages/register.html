<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - GameZone</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0a0a0f 0%, #1a1a25 50%, #12121a 100%); padding: 20px; position: relative; overflow: hidden; }
        .login-bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at 30% 20%, rgba(108, 92, 231, 0.15) 0%, transparent 50%), radial-gradient(circle at 70% 80%, rgba(253, 121, 168, 0.1) 0%, transparent 50%); }
        .login-card { background: rgba(26, 26, 37, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 50px; width: 100%; max-width: 480px; position: relative; z-index: 1; }
        .login-logo { text-align: center; margin-bottom: 30px; }
        .login-logo .logo-icon { font-size: 3rem; margin-bottom: 10px; }
        .login-logo .logo-text { font-family: 'Rajdhani', sans-serif; font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .login-title { text-align: center; margin-bottom: 30px; }
        .login-title h1 { font-size: 1.5rem; color: #fff; margin-bottom: 8px; }
        .login-title p { color: #636e72; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #dfe6e9; margin-bottom: 8px; font-weight: 500; }
        .form-group input { width: 100%; padding: 14px 18px; background: rgba(37, 37, 50, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 1rem; transition: all 0.3s; }
        .form-group input:focus { outline: none; border-color: #6c5ce7; box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .login-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%); border: none; border-radius: 10px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .login-btn:hover { box-shadow: 0 0 30px rgba(108, 92, 231, 0.5); transform: translateY(-2px); }
        .login-footer { text-align: center; margin-top: 30px; color: #636e72; }
        .login-footer a { color: #a29bfe; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-bg"></div>
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">🎮</div>
                <div class="logo-text">GameZone</div>
            </div>
            <div class="login-title">
                <h1>创建游戏账户</h1>
                <p>加入百万玩家，开启游戏之旅</p>
            </div>
            <form>
                <div class="form-row">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" placeholder="游戏昵称" required>
                    </div>
                    <div class="form-group">
                        <label>出生日期</label>
                        <input type="date" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>邮箱地址</label>
                    <input type="email" placeholder="用于账户验证" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" placeholder="至少8位，包含字母和数字" required>
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" placeholder="再次输入密码" required>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer; color: #636e72; font-size: 0.9rem;">
                        <input type="checkbox" style="width: auto; margin-top: 4px;" required>
                        <span>我已年满18周岁，同意 <a href="#" style="color: #a29bfe;">用户协议</a> 和 <a href="#" style="color: #a29bfe;">隐私政策</a></span>
                    </label>
                </div>
                <button type="submit" class="login-btn">创建账户</button>
            </form>
            <div class="login-footer">
                已有账户？ <a href="login.html">立即登录</a>
            </div>
        </div>
    </div>
</body>
</html>
