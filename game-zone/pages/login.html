<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - GameZone</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a25 50%, #12121a 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .login-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 20%, rgba(108, 92, 231, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(253, 121, 168, 0.1) 0%, transparent 50%);
        }
        .login-card {
            background: rgba(26, 26, 37, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 50px;
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 40px;
        }
        .login-logo .logo-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .login-logo .logo-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-title {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-title h1 {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 8px;
        }
        .login-title p {
            color: #636e72;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            color: #dfe6e9;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(37, 37, 50, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }
        .form-group input::placeholder {
            color: #636e72;
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #636e72;
            cursor: pointer;
        }
        .remember-me input {
            width: auto;
        }
        .forgot-link {
            color: #a29bfe;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .forgot-link:hover {
            color: #6c5ce7;
        }
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .login-btn:hover {
            box-shadow: 0 0 30px rgba(108, 92, 231, 0.5);
            transform: translateY(-2px);
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: #636e72;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }
        .divider span {
            padding: 0 16px;
            font-size: 0.9rem;
        }
        .social-login {
            display: flex;
            gap: 12px;
        }
        .social-btn {
            flex: 1;
            padding: 14px;
            background: rgba(37, 37, 50, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #dfe6e9;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .social-btn:hover {
            background: rgba(50, 50, 74, 0.8);
            border-color: rgba(255,255,255,0.2);
        }
        .login-footer {
            text-align: center;
            margin-top: 30px;
            color: #636e72;
        }
        .login-footer a {
            color: #a29bfe;
            text-decoration: none;
            font-weight: 500;
        }
        .login-footer a:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-bg"></div>
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">🎮</div>
                <div class="logo-text">GameZone</div>
            </div>
            <div class="login-title">
                <h1>欢迎回来</h1>
                <p>登录您的游戏账户</p>
            </div>
            <form>
                <div class="form-group">
                    <label>用户名或邮箱</label>
                    <input type="text" placeholder="输入用户名或邮箱">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" placeholder="输入密码">
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox">
                        <span>记住我</span>
                    </label>
                    <a href="#" class="forgot-link">忘记密码？</a>
                </div>
                <button type="submit" class="login-btn">登录</button>
            </form>
            <div class="divider">
                <span>或使用以下方式登录</span>
            </div>
            <div class="social-login">
                <button class="social-btn">
                    <span>🎯</span> Steam
                </button>
                <button class="social-btn">
                    <span>📱</span> 微信
                </button>
                <button class="social-btn">
                    <span>💬</span> QQ
                </button>
            </div>
            <div class="login-footer">
                还没有账户？ <a href="register.html">立即注册</a>
            </div>
        </div>
    </div>
    <script src="../js/main.js"></script>
</body>
</html>
