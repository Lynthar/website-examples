<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - StreamBox</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header" style="background: transparent;">
        <nav class="navbar">
            <a href="../index.html" class="logo">
                <span class="logo-icon">▶</span>
                <span>StreamBox</span>
            </a>
        </nav>
    </header>

    <div class="login-page">
        <div class="login-card">
            <h1>注册</h1>
            <p style="color: #8c8c8c; margin-bottom: 28px;">创建账户，畅享精彩内容</p>
            <form>
                <div class="form-group">
                    <input type="text" placeholder="用户名">
                </div>
                <div class="form-group">
                    <input type="email" placeholder="电子邮箱">
                </div>
                <div class="form-group">
                    <input type="password" placeholder="设置密码">
                </div>
                <div class="form-group">
                    <input type="password" placeholder="确认密码">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer; color: #8c8c8c; font-size: 0.9rem;">
                        <input type="checkbox" style="width: auto; margin-top: 4px;">
                        <span>我同意 StreamBox 的 <a href="#" style="color: #fff;">服务条款</a> 和 <a href="#" style="color: #fff;">隐私政策</a></span>
                    </label>
                </div>
                <button type="submit" class="login-btn">注册</button>
            </form>
            <div style="margin-top: 40px; color: #737373;">
                <p>已有账户？ <a href="login.html" style="color: #fff;">立即登录</a></p>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
</body>
</html>
