<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="注册PodcastHub账号，发现优质播客内容">
    <meta name="robots" content="noindex, nofollow">
    <title>注册 - PodcastHub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #fff5f2 0%, #fff 50%, #f0f7ff 100%);
            min-height: 100vh;
        }
        .auth-container {
            max-width: 420px;
            margin: 60px auto;
            padding: 40px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 25px;
        }
        .auth-logo a {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ff6b35;
            text-decoration: none;
        }
        .auth-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        .auth-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #ff6b35;
            box-shadow: 0 0 0 4px rgba(255,107,53,0.1);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 120px;
            gap: 12px;
        }
        .verify-btn {
            padding: 14px;
            background: #f5f5f5;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            color: #ff6b35;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .verify-btn:hover {
            background: #fff5f2;
            border-color: #ff6b35;
        }
        .password-strength {
            height: 4px;
            background: #e8e8e8;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
        }
        .agree-terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0 25px;
            font-size: 0.85rem;
            color: #666;
            line-height: 1.5;
        }
        .agree-terms input {
            width: 16px;
            height: 16px;
            margin-top: 2px;
            accent-color: #ff6b35;
        }
        .agree-terms a {
            color: #ff6b35;
            text-decoration: none;
        }
        .agree-terms a:hover {
            text-decoration: underline;
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6b35, #ff8c5a);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .auth-btn:hover {
            background: linear-gradient(135deg, #e55a2b, #ff6b35);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,107,53,0.35);
        }
        .auth-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #999;
            font-size: 0.85rem;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e8e8e8;
        }
        .auth-divider span {
            padding: 0 16px;
        }
        .social-login {
            display: flex;
            gap: 12px;
        }
        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            background: #fff;
            color: #333;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .social-btn:hover {
            border-color: #ff6b35;
            background: #fff9f7;
        }
        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 0.9rem;
        }
        .auth-footer a {
            color: #ff6b35;
            text-decoration: none;
            font-weight: 500;
        }
        .back-home {
            text-align: center;
            margin-top: 15px;
        }
        .back-home a {
            color: #999;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .benefits {
            background: #fff9f7;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .benefits-title {
            font-size: 0.85rem;
            color: #ff6b35;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .benefits-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.8rem;
            color: #666;
        }
        .benefits-list span::before {
            content: '✓ ';
            color: #ff6b35;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">
            <a href="../index.html">🎙️ PodcastHub</a>
        </div>

        <h1 class="auth-title">创建账号</h1>
        <p class="auth-subtitle">开启您的播客之旅</p>

        <div class="benefits">
            <div class="benefits-title">🎁 注册即享</div>
            <div class="benefits-list">
                <span>海量播客免费听</span>
                <span>个性化推荐</span>
                <span>离线下载</span>
                <span>跨设备同步</span>
            </div>
        </div>

        <form id="registerForm" onsubmit="return false;">
            <div class="form-group">
                <label for="phone">手机号码</label>
                <div class="form-row">
                    <input type="tel" id="phone" name="phone" placeholder="请输入手机号" required>
                    <button type="button" class="verify-btn">获取验证码</button>
                </div>
            </div>

            <div class="form-group">
                <label for="code">验证码</label>
                <input type="text" id="code" name="code" placeholder="请输入验证码" required>
            </div>

            <div class="form-group">
                <label for="nickname">昵称</label>
                <input type="text" id="nickname" name="nickname" placeholder="给自己起个名字吧" required>
            </div>

            <div class="form-group">
                <label for="password">设置密码</label>
                <input type="password" id="password" name="password" placeholder="8-20位，包含字母和数字" required>
                <div class="password-strength">
                    <div class="password-strength-bar"></div>
                </div>
            </div>

            <label class="agree-terms">
                <input type="checkbox" name="agree" required>
                <span>我已阅读并同意 <a href="privacy.html">隐私政策</a> 和 <a href="#">用户协议</a></span>
            </label>

            <button type="submit" class="auth-btn">立即注册</button>
        </form>

        <div class="auth-divider">
            <span>快速注册</span>
        </div>

        <div class="social-login">
            <a href="#" class="social-btn">
                <span>📱</span>
                <span>微信注册</span>
            </a>
            <a href="#" class="social-btn">
                <span>🍎</span>
                <span>Apple登录</span>
            </a>
        </div>

        <div class="auth-footer">
            已有账号？<a href="login.html">立即登录</a>
        </div>

        <div class="back-home">
            <a href="../index.html">← 返回首页</a>
        </div>
    </div>

    <script>
        // Password strength indicator
        document.getElementById('password').addEventListener('input', function() {
            var strength = 0;
            var val = this.value;
            if (val.length >= 8) strength += 33;
            if (/[a-z]/.test(val) && /[A-Z]/.test(val)) strength += 33;
            if (/\d/.test(val)) strength += 34;

            var bar = document.querySelector('.password-strength-bar');
            bar.style.width = strength + '%';
            bar.style.background = strength < 50 ? '#ff4444' : strength < 80 ? '#ffaa00' : '#00c853';
        });

        // Verify button countdown
        document.querySelector('.verify-btn').addEventListener('click', function() {
            var btn = this;
            var count = 60;
            btn.disabled = true;
            btn.textContent = count + '秒后重试';

            var timer = setInterval(function() {
                count--;
                if (count <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = '获取验证码';
                } else {
                    btn.textContent = count + '秒后重试';
                }
            }, 1000);
        });

        // Form submit
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var toast = document.createElement('div');
            toast.textContent = '注册功能维护中';
            toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#ff6b35;color:#fff;padding:12px 24px;border-radius:8px;z-index:1000;';
            document.body.appendChild(toast);
            setTimeout(function() { toast.remove(); }, 2500);
        });
    </script>
</body>
</html>
