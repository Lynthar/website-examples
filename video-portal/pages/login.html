<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - VideoPortal</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f4f4; padding: 20px; }
        .auth-card { background: white; padding: 50px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .auth-logo { text-align: center; margin-bottom: 30px; }
        .auth-logo a { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: #00a1d6; font-size: 1.5rem; font-weight: 700; }
        .auth-logo .icon { font-size: 1.5rem; }
        .auth-title { text-align: center; margin-bottom: 30px; }
        .auth-title h1 { font-size: 1.5rem; color: #212121; margin-bottom: 8px; }
        .auth-title p { color: #999; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #212121; }
        .form-group input { width: 100%; padding: 14px 16px; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 1rem; transition: all 0.3s; }
        .form-group input:focus { outline: none; border-color: #00a1d6; }
        .auth-btn { width: 100%; padding: 14px; background: #00a1d6; border: none; border-radius: 8px; color: white; font-size: 1rem; font-weight: 500; cursor: pointer; transition: all 0.3s; }
        .auth-btn:hover { background: #0089b8; }
        .auth-footer { text-align: center; margin-top: 30px; color: #999; }
        .auth-footer a { color: #00a1d6; text-decoration: none; }
        .qr-login { text-align: center; margin-top: 30px; padding-top: 30px; border-top: 1px solid #e5e5e5; }
        .qr-code { width: 120px; height: 120px; background: #f4f4f4; margin: 0 auto 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="../index.html">
                    <span class="icon">📺</span>
                    <span>VideoPortal</span>
                </a>
            </div>
            <div class="auth-title">
                <h1>登录</h1>
                <p>登录后享受更多精彩内容</p>
            </div>
            <form>
                <div class="form-group">
                    <label>手机号/邮箱</label>
                    <input type="text" placeholder="请输入手机号或邮箱" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" placeholder="请输入密码" required>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 0.9rem;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #666;">
                        <input type="checkbox" style="width: auto;">
                        自动登录
                    </label>
                    <a href="#" style="color: #00a1d6; text-decoration: none;">忘记密码</a>
                </div>
                <button type="submit" class="auth-btn">登录</button>
            </form>
            <div class="qr-login">
                <div class="qr-code">📱</div>
                <p style="color: #666; font-size: 0.9rem;">使用APP扫码登录</p>
            </div>
            <div class="auth-footer">
                没有账号？ <a href="register.html">立即注册</a>
            </div>
        </div>
    </div>
</body>
</html>
