<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - VideoPortal</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f4f4; padding: 20px; }
        .auth-card { background: white; padding: 50px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .auth-logo { text-align: center; margin-bottom: 30px; }
        .auth-logo a { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: #00a1d6; font-size: 1.5rem; font-weight: 700; }
        .auth-logo .icon { font-size: 1.5rem; }
        .auth-title { text-align: center; margin-bottom: 30px; }
        .auth-title h1 { font-size: 1.5rem; color: #212121; margin-bottom: 8px; }
        .auth-title p { color: #999; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #212121; }
        .form-group input { width: 100%; padding: 14px 16px; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 1rem; transition: all 0.3s; }
        .form-group input:focus { outline: none; border-color: #00a1d6; }
        .auth-btn { width: 100%; padding: 14px; background: #00a1d6; border: none; border-radius: 8px; color: white; font-size: 1rem; font-weight: 500; cursor: pointer; transition: all 0.3s; }
        .auth-btn:hover { background: #0089b8; }
        .auth-footer { text-align: center; margin-top: 30px; color: #999; }
        .auth-footer a { color: #00a1d6; text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="../index.html">
                    <span class="icon">📺</span>
                    <span>VideoPortal</span>
                </a>
            </div>
            <div class="auth-title">
                <h1>注册账号</h1>
                <p>加入我们，发现更多精彩</p>
            </div>
            <form>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" placeholder="请设置用户名" required>
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="tel" placeholder="请输入手机号" required>
                </div>
                <div class="form-group">
                    <label>验证码</label>
                    <div style="display: flex; gap: 12px;">
                        <input type="text" placeholder="请输入验证码" style="flex: 1;" required>
                        <button type="button" style="padding: 14px 20px; background: #f4f4f4; border: 1px solid #e5e5e5; border-radius: 8px; color: #00a1d6; cursor: pointer; white-space: nowrap;">获取验证码</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" placeholder="请设置密码（6-20位）" required>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer; color: #666; font-size: 0.9rem;">
                        <input type="checkbox" style="width: auto; margin-top: 4px;" required>
                        <span>我已阅读并同意 <a href="#" style="color: #00a1d6;">用户协议</a> 和 <a href="#" style="color: #00a1d6;">隐私政策</a></span>
                    </label>
                </div>
                <button type="submit" class="auth-btn">注册</button>
            </form>
            <div class="auth-footer">
                已有账号？ <a href="login.html">立即登录</a>
            </div>
        </div>
    </div>
</body>
</html>
