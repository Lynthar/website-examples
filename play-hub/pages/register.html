<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - PlayHub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
        .auth-card { background: white; padding: 50px; border-radius: 24px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .auth-logo { text-align: center; margin-bottom: 30px; }
        .auth-logo .icon { font-size: 3rem; margin-bottom: 10px; }
        .auth-logo .text { font-size: 1.75rem; font-weight: 800; color: #6c5ce7; }
        .auth-title { text-align: center; margin-bottom: 30px; }
        .auth-title h1 { font-size: 1.5rem; color: #2d3436; margin-bottom: 8px; }
        .auth-title p { color: #636e72; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #2d3436; }
        .form-group input { width: 100%; padding: 14px 18px; border: 2px solid #dfe6e9; border-radius: 12px; font-size: 1rem; transition: all 0.3s; }
        .form-group input:focus { outline: none; border-color: #6c5ce7; }
        .auth-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 12px; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4); }
        .auth-footer { text-align: center; margin-top: 30px; color: #636e72; }
        .auth-footer a { color: #6c5ce7; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="icon">🕹️</div>
                <div class="text">PlayHub</div>
            </div>
            <div class="auth-title">
                <h1>加入 PlayHub</h1>
                <p>注册即可保存游戏进度</p>
            </div>
            <form>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" placeholder="选择一个酷炫的昵称" required>
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" placeholder="输入邮箱地址" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" placeholder="设置密码（至少6位）" required>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer; color: #636e72; font-size: 0.9rem;">
                        <input type="checkbox" style="width: auto; margin-top: 4px;" required>
                        <span>我同意 <a href="#" style="color: #6c5ce7;">服务条款</a> 和 <a href="#" style="color: #6c5ce7;">隐私政策</a></span>
                    </label>
                </div>
                <button type="submit" class="auth-btn">创建账户</button>
            </form>
            <div class="auth-footer">
                已有账户？ <a href="login.html">立即登录</a>
            </div>
        </div>
    </div>
</body>
</html>
